# HA Entity Mapping for SenseCAP devices.

# HA Defenitions
substitutions:
# input_boolean.dani_mode_on - Panic All ON for Daniela
  ha_dani_mode_ov:
    entity_id: "input_boolean.dani_mode_on"            # ${ha_dani_mode_ov.entity_id}
    friendly_name: "Dani Mode On"                      # ${ha_dani_mode_ov.friendly_name}
    icon: "mdi:alarm-light"                            # ${ha_dani_mode_ov.icon}
    name: "Dani Mode On"                               # ${ha_dani_mode_ov.name}
    state: "off"                                       # ${ha_dani_mode_ov.state}
    last_changed: "2024-01-01T00:00:00+00:00"          # ${ha_dani_mode_ov.last_changed}
    last_updated: "2024-01-01T00:00:00+00:00"          # ${ha_dani_mode_ov.last_updated}
    entity_category: ""                                # ${ha_dani_mode_ov.entity_category}
    device_class: "switch"                             # ${ha_dani_mode_ov.device_class}
    state_class: null                                  # ${ha_dani_mode_ov.state_class}
    integration: "input_boolean"                       # ${ha_dani_mode_ov.integration}
    internal: true                                     # ${ha_dani_mode_ov.internal}
# -----------------------------------------------
# SenseCap Attributes / Variables / Substitutions
# -----------------------------------------------
  ui_dani_mode_ov:                                             # SenseCap Attributes / Variables / Substitutions
    page_location_1: "home_page_3x3_grid-sensecap.yaml"        # ${ui_dani_mode_ov.page_location_1}
    pl1_file: "pages/home_page_3x3_grid.yaml"                  # ${ui_dani_mode_ov.pl1_file}
    page_location_2: "overrides_grid-sensecap.yaml"            # ${ui_dani_mode_ov.page_location_2}
    pl2_file: pages/overrides_grid-sensecap.yaml"              # ${ui_dani_mode_ov.pl2_file}
    pl1_layout: "3x3_grid_layout"                              # ${ui_dani_mode_ov.pl1_layout}
    pl2_layout: "2x4_grid_layout"                              # ${ui_dani_mode_ov.pl2_layout}
    pl1_id: "dani_mode_ov_btn_home"                            # ${ui_dani_mode_ov.pl1_id}
    pl2_id: "dani_mode_ov_btn_overrides"                       # ${ui_dani_mode_ov.pl2_id}
    pl1_text: "Dani Mode"                                      # ${ui_dani_mode_ov.pl1_text}  
    pl1_btn1_bg_color: "sense_tile_red_off"                    # ${ui_dani_mode_ov.pl1_btn1_bg_color}
    pl1_btn1_on_bg_color: "sense_tile_red"                     # ${ui_dani_mode_ov.pl1_btn1_on_bg_color}
    pl1_btn1_off_bg_color: "sense_tile_red_off"                # ${ui_dani_mode_ov.pl1_btn_1_off_bg_color}
    pl1_btn1_row_pos: 0                                        # ${ui_dani_mode_ov.pl1_btn1_row_pos}
    pl1_btn1_col_pos: 0                                        # ${ui_dani_mode_ov.pl1_btn1_col_pos}
    pl2_btn1_row_pos: 0                                        # ${ui_dani_mode_ov.pl2_btn1_row_pos}
    pl2_btn1_col_pos: 1                                        # ${ui_dani_mode_ov.pl2_btn1_col_pos}
    pl1_on_press_action_data: "input_boolean.dani_mode_on"     # ${ui_dani_mode_ov.pl1_on_press_action_data}
    pl1_label_1_id: "dani_mode_icon_home"                      # ${ui_dani_mode_ov.pl1_label_1_id}
    pl1_widgets.btn1.widget_label_1_text: "\U000F078F"         # ${ui_dani_mode_ov.pl1_widgets.btn1.widget_label_1_text}  # "mdi:alarm-light"
    pl1_widgets.btn1.widget_label_1_color: "sense_text_muted"  # ${ui_dani_mode_ov.pl1_widgets.btn1.widget_label_1_color}
    pl1_widgets_btn1.widget_label_1_on_icon_color: "\U000F078F"      # "mdi:alarm-light" # ${ui_dani_mode_ov.pl1_widgets.btn1.widget_label_1_on_icon}
    pl1_widgets_btn1.widget_label_1_off_icon_color: "\U000F078F"     # "mdi:alarm-light" # ${ui_dani_mode_ov.pl1_widgets.btn1.widget_label_1_off_icon}
    pl1_widgets.btn1.widget_label_1_hidden: "false"            # ${ui_dani_mode_ov.pl1_widgets.btn1.widget_label_1_hidden}
    pl1_label_2_id: "dani_mode_label_home"                       # ${ui_dani_mode_ov.pl1_label_2_id}
    pl1_widgets.btn1.widget_label_2_text: "Dani Mode"          # ${ui_dani_mode_ov.pl1_widgets.btn1.widget_label_2_text}  # "Dani Mode"
    pl1_widgets.btn1.widget_label_2_color: "sense_text_muted"  # ${ui_dani_mode_ov.pl1_widgets.btn1.widget_label_2_color}
    pl1_widgets_btn1.widget_label_2_on_text_color: "white"     # ${ui_dani_mode_ov.pl1_widgets.btn1.widget_label_2_on_text_color}
    pl1_widgets_btn1.widget_label_2_off_text_color: "white"    # ${ui_dani_mode_ov.pl1_widgets.btn1.widget_label_2_off_text_color}
    pl1_widgets.btn1.widget_label_2_hidden: "false"            # ${ui_dani_mode_ov.pl1_widgets.btn1.widget_label_2_hidden}
    pl1_label_3_id: "dani_mode_value_home"                     # ${ui_dani_mode_ov.pl1_label_3_id}
    pl1_widgets.btn1.widget_label_3_text: "---"                # ${ui_dani_mode_ov.pl1_widgets.btn1.widget_label_3_text}  # Placeholder for value, can be set to "ON"/"OFF" or left blank as needed
    pl1_widgets.btn1.widget_label_3_color: "sense_text_muted"  # ${ui_dani_mode_ov.pl1_widgets.btn1.widget_label_3_color}
    pl1_widgets.btn1.widget_label_3_hidden: "false"            # ${ui_dani_mode_ov.pl1_widgets.btn1.widget_label_3_hidden}
    pl1_widgets.btn1.widget_value_on: "ON"                     # ${ui_dani_mode_ov.pl1_widgets.btn1.widget_value_on}
    pl1_widgets.btn1.widget_value_off: "OFF"                   # ${ui_dani_mode_ov.pl1_widgets.btn1.widget_value_off}
    pl1_widgets_btn1.widget_value_on_color: "white"            # ${ui_dani_mode_ov.pl1_widgets.btn1.widget_value_on_color}
    pl1_widgets_btn1.widget_value_off_color: "white"           # ${ui_dani_mode_ov.pl1_widgets.btn1.widget_value_off_color}
  
