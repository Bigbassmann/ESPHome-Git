---
# Override tile button (icon + label, no value)
# vars:
#   uid:
#   page_id:
#   row:
#   column:
#   row_span:
#   column_span:
#   text:
#   icon:
#   entity_id:
#   on_bg_color: (optional)
#   off_bg_color: (optional)
#   on_icon: (optional)
#   off_icon: (optional)
#   tile_radius: (optional)
#   tile_pad_left: (optional)
#   tile_pad_right: (optional)
#   tile_pad_top: (optional)
#   tile_pad_bottom: (optional)
#   tile_icon_font: (optional)
#   tile_label_font: (optional)

lvgl:
  pages:
    - id: !extend ${page_id | default("main_page")}
      widgets:
        - container:
            id: ${uid}
            grid_cell_row_pos: ${row}
            grid_cell_column_pos: ${column}
            grid_cell_row_span: ${row_span | default(1)}
            grid_cell_column_span: ${column_span | default(1)}
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            widgets:
              - button:
                  id: button_${uid}
                  width: 100%
                  height: 100%
                  radius: ${tile_radius | default(8)}
                  pad_left: ${tile_pad_left | default(8)}
                  pad_right: ${tile_pad_right | default(8)}
                  pad_top: ${tile_pad_top | default(4)}
                  pad_bottom: ${tile_pad_bottom | default(4)}
                  bg_color: ${off_bg_color | default("$button_off_color")}
                  widgets:
                    - label:
                        id: icon_${uid}
                        text_font: ${tile_icon_font | default("mdi_icons_40")}
                        text: ${icon}
                        align: TOP_LEFT
                        text_color: white
                    - label:
                        id: label_${uid}
                        text_font: ${tile_label_font | default("nunito_20")}
                        text: ${text}
                        align: BOTTOM_LEFT
                        text_color: white
                  on_short_click:
                    - homeassistant.action:
                        action: homeassistant.toggle
                        data:
                          entity_id: ${entity_id}

binary_sensor:
  - id: widget_sensor_${uid}
    platform: homeassistant
    entity_id: ${entity_id}
    trigger_on_initial_state: true
    on_state:
      - if:
          condition:
            - binary_sensor.is_on: widget_sensor_${uid}
          then:
            - lvgl.widget.update:
                id: button_${uid}
                bg_color: ${on_bg_color | default("$button_on_color")}
            - lvgl.widget.update:
                id: icon_${uid}
                text_color: $icon_on_color
            - if:
                condition:
                  lambda: 'return std::string("${on_icon | default("")}").size() > 0;'
                then:
                  - lvgl.label.update:
                      id: icon_${uid}
                      text: ${on_icon | default("")}
            - lvgl.widget.update:
                id: label_${uid}
                text_color: white
          else:
            - lvgl.widget.update:
                id: button_${uid}
                bg_color: ${off_bg_color | default("$button_off_color")}
            - lvgl.widget.update:
                id: icon_${uid}
                text_color: sense_text_muted
            - if:
                condition:
                  lambda: 'return std::string("${off_icon | default("")}").size() > 0;'
                then:
                  - lvgl.label.update:
                      id: icon_${uid}
                      text: ${off_icon | default("")}
            - lvgl.widget.update:
                id: label_${uid}
                text_color: white
